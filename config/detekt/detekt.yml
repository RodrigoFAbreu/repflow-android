build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

comments:
  active: true

complexity:
  active: true
  # Composable functions idiomatically take one parameter per piece of state
  # plus one callback per user event (Compose's "state in, events out"
  # pattern) and are naturally longer than a typical function because a UI
  # tree is laid out inline - neither is a sign of poor decomposition the way
  # it would be in non-Compose code.
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated: ['Composable']

performance:
  active: true

potential-bugs:
  active: true

style:
  active: true
  # Formatting (indentation, wildcard imports, trailing commas, etc.) is
  # handled by Spotless/ktlint, not Detekt, to avoid the two tools disagreeing.
  MaxLineLength:
    active: false
  # Use cases favour sequential guard-clause early returns (validate, check
  # existence, check uniqueness, ...) over deeply nested `when`/`if`
  # expressions. excludeGuardClauses keeps that idiom without raising the
  # limit for genuinely branchy, non-guard-clause functions elsewhere.
  ReturnCount:
    excludeGuardClauses: true
  # A design-token file is definitionally a list of literal values transcribed
  # from a design source (colour hexes, opacity multipliers). Introducing a
  # named constant per literal only to feed it straight into the token it
  # already names adds a second name for the same thing and one more place a
  # transcription error can hide; the values are pinned by RepFlowThemeTest
  # instead. The default excludes (test sources) are restated because setting
  # this key replaces the rule's default list rather than adding to it.
  MagicNumber:
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/*.Test.kt'
      - '**/*.Spec.kt'
      - '**/*.Spek.kt'
      - '**/presentation/designsystem/**'
  # The same token object deliberately keeps every member a plain `val`: some
  # of its tokens are @Composable getters that can never be `const`, and the
  # rest are named exactly as the plan and their call sites name them, which
  # ktlint's property-naming rule would force into screaming snake case the
  # moment they became `const`.
  MayBeConst:
    excludes:
      - '**/presentation/designsystem/**'
