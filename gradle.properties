# Intentionally does NOT set org.gradle.java.home here: that would hardcode a
# machine-specific path into a file shared by every contributor and by CI,
# breaking builds anywhere else. Instead, gradle/gradle-daemon-jvm.properties
# (Gradle's daemon toolchain criteria, generated by `./gradlew updateDaemonJvm`)
# pins the Gradle daemon to JDK 21 and is auto-detected or auto-downloaded on
# any machine, independent of JAVA_HOME. Android Studio's bundled JBR 21
# satisfies this criteria directly. CI configures its own JDK 21 via the
# workflow's setup-java step for the same reason.
#
# Java/Kotlin bytecode target compatibility is a separate, lower-level
# setting: app/build.gradle.kts pins compileOptions to Java 17 source/target
# compatibility, and AGP's built-in Kotlin compiler follows that same setting
# (no separate Kotlin Gradle plugin is applied in this project). Running the
# build on a JDK 21 daemon does not change the produced bytecode version.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
