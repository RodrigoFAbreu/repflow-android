# Intentionally does NOT set org.gradle.java.home here: that would hardcode a
# machine-specific path (this machine's Android Studio JBR) into a file shared
# by every contributor and by CI, breaking builds anywhere else. When Android
# Studio opens this project it automatically uses its own bundled JBR for the
# Gradle daemon. For command-line builds on this machine, set JAVA_HOME to the
# Android Studio JBR before invoking ./gradlew, e.g.:
#   JAVA_HOME=/opt/android-studio/jbr ./gradlew tasks
# CI configures its own JDK 17 via the workflow's setup-java step instead.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
