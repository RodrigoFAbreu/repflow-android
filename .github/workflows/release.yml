# Reusable: classifies a commit on main with the Controller's release transaction and, when a release
# is due, builds the APK, verifies it, tags it and publishes a GitHub Release.
name: Release

on:
  workflow_call:
    secrets:
      signing-keystore:
        description: Base64 of the debug keystore the owner's phone has the app signed with
        required: true

permissions:
  contents: read

jobs:
  release-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      state: ${{ steps.classify.outputs.state }}
      version: ${{ steps.classify.outputs.version }}
      commit: ${{ steps.classify.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/install-controller
        with:
          github-token: ${{ github.token }}
      - name: Classify
        id: classify
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: "!gh auth git-credential"
        run: python3 tools/release.py classify --commit "$(git rev-parse "$GITHUB_SHA^{commit}")"

  build:
    needs: release-plan
    if: needs.release-plan.outputs.state == 'RELEASE_DUE' || needs.release-plan.outputs.state == 'RESUME'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: main-release
    env:
      RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-plan.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/install-controller
        with:
          github-token: ${{ github.token }}
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.signing-keystore }}
        run: |
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Build
        run: python3 tools/release.py build
      - name: Verify
        run: python3 tools/release.py verify
      - name: Checksums
        run: python3 tools/release.py checksums dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    needs: [release-plan, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: main-release-publish
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ needs.release-plan.outputs.commit }}
      RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/install-controller
        with:
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Publish
        run: python3 tools/release.py publish --commit "$COMMIT"
