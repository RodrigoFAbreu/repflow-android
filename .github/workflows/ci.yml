name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python (workflow fingerprint conformance suite)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Static analysis (Detekt)
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest

      - name: Workflow fingerprint conformance suite (hermetic only, stdlib-only, no install step)
        working-directory: scripts
        run: python3 workflow_fingerprint_test.py
        # workflow_fingerprint_demo_test.py is intentionally NOT run here:
        # it computes plan-stage classification from a fixed historical
        # base commit, so once this milestone merges, any later unrelated
        # product PR would fail this job purely because the diff from that
        # fixed base now includes product paths this process plan never
        # classified (GPT-R9-002). Run it locally/explicitly instead:
        # `python3 scripts/workflow_fingerprint_demo_test.py`.

      - name: Workflow state conformance suite (hermetic only, stdlib-only, no install step)
        working-directory: scripts
        run: python3 workflow_state_test.py
        # workflow_state_demo_test.py is intentionally NOT run here, for the
        # same GPT-R9-002 reason as workflow_fingerprint_demo_test.py above:
        # it reads this milestone's own real WORKFLOW_STATE.json/registry
        # against a fixed historical base commit. Run it locally/explicitly
        # instead: `python3 scripts/workflow_state_demo_test.py`.

      - name: Workflow test-harness self-verification (WF8a-i, hermetic, stdlib-only)
        working-directory: scripts
        run: python3 workflow_test_harness_test.py

      - name: Workflow integration/conformance suite (WF8a-ii, hermetic, stdlib-only)
        working-directory: scripts
        run: python3 workflow_integration_test.py
        # Reads .claude/commands/*.md and docs/ai-workflow/WORKFLOW_V2_PLAN.md's
        # current content directly (dual-mode text conformance, write-set
        # consistency lint) plus disposable ScratchRepo fixtures -- none of
        # this depends on a fixed historical base commit or a diff that
        # widens over time, so unlike the *_demo_test.py suites this is
        # safe to run on every PR (GPT-R9-002 does not apply here). The two
        # tests in TestGoldenV1BehaviorAgainstPreV21BaseCommit that compare
        # against real pre-v2.1 command-file content use an embedded,
        # already-verified sha256 constant rather than `git show
        # <base_commit>:...` at test time, since this checkout step's
        # default shallow clone would not have that historical commit
        # reachable.

      - name: Workflow acceptance matrix (salvage audit, hermetic, stdlib-only)
        working-directory: scripts
        run: python3 workflow_acceptance_matrix_test.py
        # docs/ai-workflow/audit/WORKFLOW_ACCEPTANCE_MATRIX.md's every row,
        # executed against disposable scratch repositories that carry a real
        # copy of the tooling and drive the real prepare-ai-review.sh -- for
        # both a process and a product work item. No fixed historical base
        # commit and no dependence on this repository's own live
        # WORKFLOW_STATE.json, so GPT-R9-002 does not apply and this is safe
        # on every PR.

      - name: Completion-obligations and state-serialization suite (D-Completion-Obligations, hermetic, stdlib-only)
        working-directory: scripts
        run: python3 workflow_state_completion_obligations_test.py
        # Salvage audit `O4`: `D1`'s `state_lock`/`state_transaction`
        # serialization primitive and `D-Completion-Obligations`
        # (`discover_state_writers`, `verify_wfo_state_serialization`,
        # `resolve_completion_obligations`, `complete_work_item`'s
        # `UnsatisfiedCompletionObligationError` gate, and
        # `verify_wfo_ledger_coverage`) -- i.e. the release gate itself.
        # It ran only on demand until this round, which meant a change
        # breaking `/accept-milestone`'s own obligation verdict reached
        # main with every other suite green. Disposable scratch Git
        # repositories only: no fixed historical base commit and no
        # dependence on this repository's own live WORKFLOW_STATE.json, so
        # GPT-R9-002 does not apply and this is safe on every PR.

      - name: Fingerprint generalization conformance suite (D-Fingerprint-Generalization, hermetic, stdlib-only)
        working-directory: scripts
        run: python3 workflow_fingerprint_generalization_test.py
        # Missing-test items 141-166 (Revision 21, WF8B-S1-001): per-work-
        # item plan-stage metadata resolution, the fail-closed matrix,
        # manifest work-item binding, and the resume-branch declaration-fact
        # writer -- all against disposable ScratchRepo fixtures, no fixed
        # historical base commit, safe on every PR.
